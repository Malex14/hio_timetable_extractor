services:
  scraper:
    image: ghcr.io/malex14/hio_timetable_extractor:edge
    environment:
      HIO_INSTANCE: "https://myhaw.haw-hamburg.de"
      EXPORT_DIR: "/eventfiles"
      PERIOD: "6"
      GIT_URL: "git@github.com:HAWHHCalendarBot/eventfiles.git"
      PERIOD_ID: 223
    volumes:
      - "eventfiles:/eventfiles"
    restart: always

volumes:
  eventfiles:
